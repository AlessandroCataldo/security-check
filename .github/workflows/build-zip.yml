name: Aggiorna lo zip della skill
on:
  push:
    branches: [main]
    paths: ['skills/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crea lo zip
        run: |
          rm -f security-check.zip
          cd skills && zip -qrX ../security-check.zip security-check
      - name: Committa se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add security-check.zip
          git diff --cached --quiet && echo "zip invariato" && exit 0
          git commit -m "Aggiorna security-check.zip"
          git push
